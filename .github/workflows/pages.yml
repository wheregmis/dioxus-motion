name: Pages

on:
  workflow_run:
    workflows: ["GitHub Pages"]
    types: [completed]
  # pull_request_target runs the default-branch workflow with a write token, so
  # closing a fork PR can still delete its preview. Cleanup never runs PR code.
  pull_request_target:
    types: [closed]

permissions:
  actions: read
  contents: write
  pull-requests: write

# Every publisher writes to the same gh-pages branch, so they share one group.
# One pending run per group: a run queued behind an in-flight publish is
# replaced by a newer event, which can drop a stale preview redeploy.
concurrency:
  group: gh-pages-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    uses: DioxusLabs/dioxus-ci/.github/workflows/pages-publish.yml@60c40430ef69c6d7b92439bc43e281689db1bde7
    with:
      pages-url-base: https://wheregmis.github.io
