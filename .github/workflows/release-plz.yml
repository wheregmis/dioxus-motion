name: Release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  RELEASE_PLZ_VERSION: 0.3.169

jobs:
  # Publish only the dispatched main commit after its CI run succeeds.
  release-plz-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Release-plz release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
      pull-requests: read
      id-token: write
    concurrency:
      group: release-plz-publish
      cancel-in-progress: false
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful CI for this commit
        run: python3 scripts/check_release_ci.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          version: ${{ env.RELEASE_PLZ_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The App token lets release PRs trigger the required CI workflows.
  release-plz-pr:
    if: github.event_name == 'push'
    name: Release-plz PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - name: Generate release PR token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          version: ${{ env.RELEASE_PLZ_VERSION }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
