name: Release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  RELEASE_PLZ_VERSION: 0.3.169

jobs:
  # Publish only the dispatched main commit after its CI run succeeds.
  release-plz-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Release-plz release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
      pull-requests: read
      id-token: write
    concurrency:
      group: release-plz-publish
      cancel-in-progress: false
    steps:
      # A depth-one checkout prevents release-plz from rewinding to a PR ancestor.
      - name: Checkout publication commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
      - name: Require successful CI for this commit
        run: python3 scripts/check_release_ci.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          version: ${{ env.RELEASE_PLZ_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Prepare release PRs with the built-in repository token.
  release-plz-pr:
    if: github.event_name == 'push'
    name: Release-plz PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - *install-rust
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          version: ${{ env.RELEASE_PLZ_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
