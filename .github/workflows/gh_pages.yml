name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'packages/**'
      - 'Cargo.*'
      - '.github/workflows/gh_pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build styles
        working-directory: docs
        run: |
          npm ci
          npm run css -- --minify
      - uses: taiki-e/install-action@cargo-binstall
      - name: Install matching Dioxus CLI
        run: cargo binstall --no-confirm --locked dioxus-cli@0.7.10
      - name: Bundle documentation
        working-directory: docs
        run: dx bundle --release --platform web --locked
      - name: Add SPA fallback
        run: cp target/dx/docs/release/web/public/index.html target/dx/docs/release/web/public/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/dx/docs/release/web/public

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
