name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'packages/**'
      - 'Cargo.*'
      - '.github/workflows/gh_pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Resolve pages paths
        id: paths
        shell: bash
        env:
          BASE_PATH: ${{ github.event.repository.name }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          base_path = os.environ["BASE_PATH"].strip().strip("/")
          pr_number = os.environ["PR_NUMBER"]

          target_folder = ""
          build_base_path = base_path
          if os.environ["EVENT_NAME"] == "pull_request":
              if not pr_number:
                  raise SystemExit("pull_request event is missing a PR number")
              target_folder = f"pr-preview/pr-{int(pr_number)}"
              build_base_path = "/".join(part for part in (base_path, target_folder) if part)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"site-base-path={base_path}\n")
              output.write(f"build-base-path={build_base_path}\n")
              output.write(f"target-folder={target_folder}\n")
          PY
      - name: Build styles
        working-directory: docs
        run: |
          npm ci
          npm run css -- --minify
      - uses: taiki-e/install-action@cargo-binstall
      - name: Install matching Dioxus CLI
        run: cargo binstall --no-confirm --locked dioxus-cli@0.7.10
      - name: Bundle documentation
        working-directory: docs
        run: dx bundle --release --platform web --locked --base-path "${{ steps.paths.outputs.build-base-path }}"
      - name: Add SPA fallback
        run: cp target/dx/docs/release/web/public/index.html target/dx/docs/release/web/public/404.html
      - name: Stage pages artifact
        shell: bash
        env:
          OUTPUT_PATH: target/dx/docs/release/web/public
          ARTIFACT_DIR: ${{ runner.temp }}/dioxus-pages
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          MERGE_SHA: ${{ github.sha }}
          SITE_BASE_PATH: ${{ steps.paths.outputs.site-base-path }}
          BUILD_BASE_PATH: ${{ steps.paths.outputs.build-base-path }}
          TARGET_FOLDER: ${{ steps.paths.outputs.target-folder }}
        run: |
          set -euo pipefail
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/site"
          cp -a "$OUTPUT_PATH/." "$ARTIFACT_DIR/site/"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact_dir = Path(os.environ["ARTIFACT_DIR"])
          event_name = os.environ["EVENT_NAME"]
          pr_number = os.environ["PR_NUMBER"]
          pr_number_value = int(pr_number) if pr_number else None
          head_sha = os.environ["HEAD_SHA"] or os.environ["WORKFLOW_SHA"]
          merge_sha = os.environ["MERGE_SHA"] if event_name == "pull_request" else ""
          metadata = {
              "schema_version": 1,
              "kind": "dioxus-pages",
              "repository": os.environ["REPOSITORY"],
              "event_name": event_name,
              "ref": os.environ["REF"],
              "ref_name": os.environ["REF_NAME"],
              "pr_number": pr_number_value,
              "head_sha": head_sha,
              "merge_sha": merge_sha,
              "site_base_path": os.environ["SITE_BASE_PATH"],
              "base_path": os.environ["BUILD_BASE_PATH"],
              "target_folder": os.environ["TARGET_FOLDER"],
          }
          (artifact_dir / ".dioxus-ci-pages.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dioxus-pages
          path: ${{ runner.temp }}/dioxus-pages
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
