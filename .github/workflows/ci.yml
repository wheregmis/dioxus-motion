name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Check that the code compiles and passes clippy
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check browser workspace
        run: cargo check --workspace --target wasm32-unknown-unknown --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-features --locked -- -D warnings

      - name: Install browser check tools
        run: |
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
          python3 - <<'PY'
          import io, json, os, pathlib, re, subprocess, urllib.request, zipfile
          version = subprocess.check_output(["google-chrome", "--version"], text=True)
          build = re.search(r"\d+\.\d+\.\d+", version).group()
          manifest = json.load(urllib.request.urlopen("https://googlechromelabs.github.io/chrome-for-testing/latest-patch-versions-per-build-with-downloads.json", timeout=30))
          downloads = manifest["builds"][build]["downloads"]["chromedriver"]
          url = next(d["url"] for d in downloads if d["platform"] == "linux64")
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "motion-browser"
          zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(url, timeout=60).read())).extractall(root)
          driver = root / "chromedriver-linux64/chromedriver"
          driver.chmod(0o755)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CHROMEDRIVER={driver}\n")
          PY

      - name: Check browser timer ownership
        run: python3 scripts/check_browser_delay.py

  # Run tests on different platforms
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "web"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "desktop"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "transitions"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "web,transitions"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "desktop,transitions"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "web"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "desktop"
          - os: macos-latest
            target: x86_64-apple-darwin
            features: "web"
          - os: macos-latest
            target: x86_64-apple-darwin
            features: "desktop"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest' && contains(matrix.features, 'desktop')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        # Run all unit, integration and doc tests for the specific target
        run: cargo test --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }} --locked

  # Check documentation
  docs:
    name: Check documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check documentation
        run: cargo doc --workspace --no-deps --all-features --locked

      - name: Test documentation examples
        run: cargo test -p docs --all-features --locked

  # Check formatting
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Security audit
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  msrv:
    name: Check MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check published crates on native and WASM
        run: |
          cargo check -p dioxus-motion -p dioxus-motion-transitions-macro --all-features --lib --locked
          cargo check -p dioxus-motion --all-features --lib --target wasm32-unknown-unknown --locked

  release-checks:
    name: Check release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
      - name: Test release CI gate
        run: python3 scripts/test_release_ci.py
